<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuke from Orbit Software</title>
  <meta name="description"
    content="Nuke from Orbit Software — machine learning, performance engineering, and game engine work. The only way to be sure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
  <style>
    :root {
      --void: #0a0d0a;
      --panel: #12180f;
      --panel-2: #161d13;
      --line: #2c3826;
      --phosphor: #3ef07d;
      --phosphor-dim: #1f6b41;
      --amber: #ffb400;
      --alert: #ff3b30;
      --ink: #d9e6d2;
      --ink-dim: #7c8c77;
      --font-display: 'Big Shoulders Stencil', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--void);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    a {
      color: var(--phosphor);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.10) 3px);
      mix-blend-mode: multiply;
      opacity: 0.5;
    }

    .hazard {
      height: 10px;
      background-image: repeating-linear-gradient(135deg, var(--amber) 0 14px, #0a0d0a 14px 28px);
    }

    /* ---------- top bar ---------- */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px clamp(16px, 4vw, 48px);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex-wrap: wrap;
      gap: 8px 20px;
    }

    .topbar .tag {
      color: var(--phosphor);
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--phosphor);
      box-shadow: 0 0 6px var(--phosphor);
      margin-right: 6px;
      animation: blink 2.4s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    /* ---------- layout shell ---------- */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 48px);
    }

    section {
      padding: clamp(48px, 8vw, 88px) 0;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
    }

    .eyebrow::before {
      content: "//";
      color: var(--phosphor-dim);
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 900;
      text-transform: uppercase;
      margin: 0;
      text-wrap: balance;
    }

    /* ---------- hero ---------- */
    .hero {
      padding-top: clamp(56px, 10vw, 100px);
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: clamp(32px, 5vw, 64px);
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 6.4vw, 5.2rem);
      line-height: 0.94;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-shadow: 0 0 22px rgba(62, 240, 125, 0.18);
    }

    .hero h1 .accent {
      color: var(--phosphor);
    }

    .tagline {
      font-family: var(--font-mono);
      color: var(--phosphor);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      margin: 22px 0 0;
      border-left: 3px solid var(--phosphor-dim);
      padding-left: 14px;
    }

    .tagline .cursor {
      display: inline-block;
      width: 0.55em;
      background: var(--phosphor);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    .cta-row {
      display: flex;
      gap: 14px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 13px 22px;
      border: 1px solid var(--phosphor-dim);
      color: var(--phosphor);
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: var(--phosphor);
      color: var(--void);
      border-color: var(--phosphor);
    }

    .btn.solid {
      background: var(--amber);
      border-color: var(--amber);
      color: #241a00;
    }

    .btn.solid:hover {
      background: #ffcb4d;
      border-color: #ffcb4d;
    }

    /* ---------- motion tracker ---------- */
    .tracker {
      position: relative;
      width: min(320px, 90%);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #0d150c 0%, #0a0f09 70%, #070a06 100%);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(62, 240, 125, 0.06);
    }

    .tracker svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tracker-ring {
      fill: none;
      stroke: var(--phosphor-dim);
      stroke-width: 0.6;
      opacity: 0.55;
    }

    .tracker-crosshair {
      stroke: var(--phosphor-dim);
      stroke-width: 0.4;
      opacity: 0.45;
    }

    .sweep {
      transform-origin: 100px 100px;
      animation: sweep 4s linear infinite;
    }

    @keyframes sweep {
      to {
        transform: rotate(360deg);
      }
    }

    .blip {
      fill: var(--phosphor);
      animation: ping 2.4s ease-out infinite;
    }

    .blip.b2 {
      animation-delay: 0.8s;
    }

    .blip.b3 {
      animation-delay: 1.6s;
      fill: var(--alert);
    }

    @keyframes ping {
      0% {
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      20% {
        opacity: 0.15;
      }

      100% {
        opacity: 0.15;
      }
    }

    .tracker-readout {
      position: absolute;
      left: 50%;
      bottom: -34px;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .tracker-readout .beep {
      color: var(--phosphor);
    }

    /* ---------- footer ---------- */
    footer {
      border-top: 1px solid var(--line);
      padding: 22px clamp(16px, 4vw, 48px) 30px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-dim);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    @media (max-width:820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero .tracker-wrap {
        order: -1;
      }
    }
  </style>
</head>

<body>

  <div class="scanlines" aria-hidden="true"></div>

  <div class="topbar">
    <span><span class="dot"></span><span class="tag">UPLINK STABLE</span> — WY-CORP NETWORK 7</span>
    <span>REGISTRY NO. NFO-1986-SULACO</span>
    <span>SYSTEM STATUS: <span class="tag">NOMINAL</span></span>
  </div>

  <div class="hazard" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <div>
        <h1>NUKE<br>FROM <span class="accent">ORBIT</span><br>SOFTWARE</h1>
        <p class="tagline">"The only way to be sure...<span class="cursor"></span>"</p>
        <div class="cta-row">
          <a class="btn solid" href="mailto:contact@nukefromorbit.se">INITIATE CONTACT</a>
        </div>
      </div>
      <div class="tracker-wrap">
        <div class="tracker">
          <svg viewBox="0 0 200 200">
            <circle class="tracker-ring" cx="100" cy="100" r="90" />
            <circle class="tracker-ring" cx="100" cy="100" r="62" />
            <circle class="tracker-ring" cx="100" cy="100" r="34" />
            <line class="tracker-crosshair" x1="100" y1="6" x2="100" y2="194" />
            <line class="tracker-crosshair" x1="6" y1="100" x2="194" y2="100" />
            <g class="sweep">
              <path d="M100,100 L100,6 A94,94 0 0,1 166,34 Z" fill="url(#sweepGrad)" />
            </g>
            <defs>
              <linearGradient id="sweepGrad" x1="100" y1="6" x2="166" y2="34" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#3ef07d" stop-opacity="0.35" />
                <stop offset="1" stop-color="#3ef07d" stop-opacity="0" />
              </linearGradient>
            </defs>
            <circle class="blip" cx="132" cy="70" r="3" />
            <circle class="blip b2" cx="66" cy="122" r="2.4" />
            <circle class="blip b3" cx="120" cy="146" r="3.2" />
          </svg>
          <div class="tracker-readout"><span class="beep">●</span> 3 CONTACTS — FRAME-TIME SPIKES DETECTED</div>
        </div>
      </div>
    </section>
  </main>

  <div class="hazard" aria-hidden="true"></div>
  <footer>
    <span>NUKE FROM ORBIT SOFTWARE AB — MALMÖ, SWEDEN</span>
  </footer>

</body>

</html>
